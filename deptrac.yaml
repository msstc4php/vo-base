deptrac:
  paths:
    - ./src
  layers:
    - name: Core
      collectors:
        - type: directory
          value: src/.*
    # These two layers exist only to be forbidden. The bridges that used to live
    # here are separate packages now; this rule is what stops them coming back,
    # and unlike a convention it outlives the code that prompted it.
    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\#'
    - name: Symfony
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\#'
  ruleset:
    Core: ~
    Doctrine: ~
    Symfony: ~
